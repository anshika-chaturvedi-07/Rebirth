# Render Blueprint for the REBIRTH API (free plan). See DEPLOY.md.
# The database is Neon's free Postgres: paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: rebirth-api
    runtime: python
    plan: free
    region: singapore # closest free region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migrate, add demo data on the first boot only (the seed skips a non-empty database), then serve
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string, entered in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false # optional: without it the live site has no usable admin login
      - key: CLOUDINARY_URL
        sync: false # optional: cloudinary://KEY:SECRET@CLOUD so photos survive restarts
      - key: VISION_ENABLED
        value: "false" # the AI model needs ~600 MB; the free plan has 512 MB
      - key: VISION_PRELOAD
        value: "false"
      - key: MEDIA_DIR
        value: /tmp/rebirth-media
