# Local infrastructure for REBIRTH.
# Runs the API on Postgres/PostGIS. (Local dev can skip Docker: the API defaults to SQLite.)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rebirth
      POSTGRES_PASSWORD: rebirth
      POSTGRES_DB: rebirth
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://rebirth:rebirth@db:5432/rebirth
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: [db, redis]

volumes:
  db-data:
