# Local infrastructure for REBIRTH.
# Phase 1 only needs the frontend and API; Postgres/PostGIS and Redis are ready for Phase 2.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rebirth
      POSTGRES_PASSWORD: rebirth
      POSTGRES_DB: rebirth
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env.example
    ports: ["8000:8000"]
    depends_on: [db, redis]

volumes:
  db-data:
