name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rebirth
          POSTGRES_PASSWORD: rebirth
          POSTGRES_DB: rebirth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rebirth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://rebirth:rebirth@localhost:5432/rebirth_test' || 'sqlite:///./ci.db' }}
      - name: Tests
        # the AI model (requirements-ml.txt) isn't installed here, so its one real-model test is skipped
        run: pytest -q -p no:warnings
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://rebirth:rebirth@localhost:5432/rebirth_test' || '' }}

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npx next build
        env:
          API_URL: http://localhost:8300
